<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>403 — Доступ заблокирован | Nanogram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0c10 0%, #2d1b3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .ban-card {
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(159, 139, 229, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ban-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        h1 {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #da3633, #f85149);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        h2 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .reason-box {
            background: rgba(33, 38, 45, 0.8);
            border-radius: 24px;
            padding: 20px;
            margin: 24px 0;
            text-align: left;
            border-left: 4px solid #da3633;
        }
        .reason-box p {
            color: #b0b3b8;
            margin: 8px 0;
            line-height: 1.5;
        }
        .reason-box strong {
            color: #ffd700;
        }
        .support {
            background: rgba(159, 139, 229, 0.1);
            border-radius: 24px;
            padding: 16px;
            margin: 20px 0;
        }
        .support a {
            color: #9f8be5;
            text-decoration: none;
        }
        button {
            background: linear-gradient(135deg, #9f8be5, #b09cff);
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(159, 139, 229, 0.3);
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #6e7681;
        }
    </style>
</head>
<body>
    <div class="ban-card">
        <div class="ban-icon">🚫🧪</div>
        <h1>403</h1>
        <h2>Доступ заблокирован</h2>
        
        <div class="reason-box">
            <p><strong>📋 Причина блокировки:</strong></p>
            <p id="banReason">Нарушение правил пользования</p>
            <p style="margin-top: 12px;"><strong>📅 Дата блокировки:</strong></p>
            <p id="banDate">—</p>
        </div>
        
        <div class="support">
            <p>📧 <strong><a href="mailto:support@nanogram.ru">support@nanogram.ru</a></strong></p>
            <p>📞 <strong>+7 987 756 06 84</strong></p>
            <p style="font-size: 12px; margin-top: 8px;">🕒 Пн–Пт, 10:00–18:00</p>
        </div>
        
        <button onclick="location.href='/'">🔄 Попробовать снова</button>
        <div class="footer">
            <p>Nanogram — безопасный мессенджер</p>
        </div>
    </div>
    
    <script>
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        const date = urlParams.get('date');
        
        if (reason) {
            document.getElementById('banReason').textContent = decodeURIComponent(reason);
        }
        if (date) {
            document.getElementById('banDate').textContent = new Date(date).toLocaleString('ru-RU');
        }
        
        // Логируем показ страницы бана
        console.log('🚫 Страница бана показана:', { reason, date });
    </script>
</body>
</html>
